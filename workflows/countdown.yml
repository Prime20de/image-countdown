name: Countdown-Bild aktualisieren

on:
  schedule:
    - cron: "5 0 * * *"   # täglich 00:05 UTC (= 01:05/02:05 Uhr deutsche Zeit)
  workflow_dispatch:       # manuell startbar
  push:
    branches: [main]
    paths: ["generate.py"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python generate.py
      - name: Änderung committen
        run: |
          git config user.name "countdown-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/countdown.png
          git diff --cached --quiet || git commit -m "Countdown aktualisiert"
          git push
